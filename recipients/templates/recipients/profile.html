{% extends 'base.html' %}

{% block title %}Recipient Profile - Food Bridge{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Recipient Profile</h2>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Organization Name</label>
                            <input type="text" name="organization_name" value="{{ recipient_profile.organization_name }}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Recipient Type</label>
                            <select name="recipient_type" class="form-select">
                                {% for value, label in recipient_profile.RECIPIENT_TYPE_CHOICES %}
                                    <option value="{{ value }}" {% if recipient_profile.recipient_type == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="3">{{ recipient_profile.address }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone_number" value="{{ recipient_profile.phone_number }}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" value="{{ recipient_profile.email }}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Registration Number</label>
                            <input type="text" name="registration_number" value="{{ recipient_profile.registration_number }}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contact Person</label>
                            <input type="text" name="contact_person" value="{{ recipient_profile.contact_person }}" class="form-control">
                        </div>
                        <button class="btn btn-primary">Save Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
