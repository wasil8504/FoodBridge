{% extends 'base.html' %}

{% block title %}Request Donation - Food Bridge{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-3">Request Donation</h2>
                    <p class="mb-4">You are requesting <strong>{{ donation.get_food_type_display }}</strong> from <strong>{{ donation.donor.username }}</strong>.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="message" class="form-label">Message to Donor (optional)</label>
                            <textarea id="message" name="message" class="form-control" rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">Submit Request</button>
                        <a href="{% url 'recipients:donation_detail' donation.pk %}" class="btn btn-link">Back to Details</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
