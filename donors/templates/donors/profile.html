{% extends 'base.html' %}

{% block title %}Donor Profile - Food Bridge{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Donor Profile</h2>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Organization Name</label>
                            <input type="text" name="organization_name" value="{{ donor_profile.organization_name }}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Donor Type</label>
                            <select name="donor_type" class="form-select">
                                {% for value, label in donor_profile.DONOR_TYPE_CHOICES %}
                                    <option value="{{ value }}" {% if donor_profile.donor_type == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="3">{{ donor_profile.address }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone_number" value="{{ donor_profile.phone_number }}" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">License Number</label>
                            <input type="text" name="license_number" value="{{ donor_profile.license_number }}" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">Save Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
